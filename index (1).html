<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Exchange</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1f2430; --muted:#6b7280; --accent:#c2410c; --line:#e5e1d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --card:#20232b; --ink:#f1f1f1; --muted:#9aa0aa; --accent:#fb923c; --line:#32363f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
          border-radius:16px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:10px;
          background:transparent; color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:18px; width:100%; padding:12px; font-size:1rem; font-weight:600; border:0;
           border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); margin-top:10px; }
  #msg { margin-top:14px; color:#b91c1c; min-height:1.2em; }
  #result { margin-top:22px; padding:20px; text-align:center; border-radius:12px; background:rgba(194,65,12,.08); }
  #result p { margin:0; color:var(--muted); }
  #result h2 { margin:6px 0 0; font-size:1.7rem; color:var(--accent); word-break:break-word; }
</style>
</head>
<body>
<main class="card">
  <h1>🎁 Gift Exchange</h1>
  <p class="sub">Enter your name to see who you're giving a gift to. Only you can see your result.</p>

  <form id="f" autocomplete="off">
    <label for="name">Your full name</label>
    <input id="name" required placeholder="e.g. Jane Isaac">
    <div id="codeWrap" hidden>
      <label for="code">Your personal code</label>
      <input id="code" placeholder="The code the organiser sent you">
    </div>
    <button id="go" type="submit">Show me</button>
  </form>
  <div id="msg" role="status"></div>

  <div id="result" hidden>
    <p>You are giving a gift to</p>
    <h2 id="who"></h2>
    <button id="hide" class="ghost" type="button">Hide</button>
  </div>
</main>

<script src="core.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let data = null, timer = null;

  fetch('data.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      data = d;
      if (!d.entries || !d.entries.length) $('msg').textContent = 'The draw hasn\'t been published yet. Check back soon.';
      if (d.needsCode) $('codeWrap').hidden = false;
    })
    .catch(() => { $('msg').textContent = 'Could not load the draw. Please try again later.'; });

  function hideResult() {
    clearTimeout(timer);
    $('result').hidden = true; $('who').textContent = '';
    $('name').value = ''; $('code').value = '';
  }
  $('hide').onclick = hideResult;

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('msg').textContent = ''; $('result').hidden = true;
    if (!data || !data.entries || !data.entries.length) return;
    $('go').disabled = true; $('go').textContent = 'Checking…';
    const to = await GiftCore.openEntry(data, $('name').value, $('code').value);
    $('go').disabled = false; $('go').textContent = 'Show me';
    if (!to) {
      $('msg').textContent = data.needsCode
        ? 'We couldn\'t match that name and code. Check the spelling and try again.'
        : 'We couldn\'t find that name. Check the spelling (use the name the organiser has for you).';
      return;
    }
    $('who').textContent = to;
    $('result').hidden = false;
    timer = setTimeout(hideResult, 60000); // auto-hide after 1 minute
  });
</script>
</body>
</html>
